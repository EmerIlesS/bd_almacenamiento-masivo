name: DataOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Terraform Validation & Python Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: 🔍 Validar Terraform
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar dependencias para pruebas
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pytest

      - name: 🧪 Ejecutar pruebas unitarias de DataOps
        run: |
          pytest -v tests/
